<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор кузовного ремонта</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap');

  :root {
    --red: #d20124;
    --dark: #111;
    --mid: #222;
    --gray: #c2c3c5;
    --lightgray: #f0f0f0;
    --text: #333;
    --border: #ddd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  * { -webkit-tap-highlight-color: transparent; }

  svg { touch-action: manipulation; }

  body {
    font-family: 'PT Sans', sans-serif;
    background: #1a1a1a;
    color: var(--text);
    min-height: 100vh;
  }

  #calculator {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    color: #fff;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding-bottom: 12px;
    border-bottom: 3px solid var(--red);
  }

  .top-bar {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 0;
    margin-bottom: 0;
    align-items: stretch;
  }

  .calc-title {
    background: var(--dark);
    color: var(--red);
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 20px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    border-left: 4px solid var(--red);
  }

  .type-selector {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 2px solid var(--gray);
  }

  .auto-btn {
    background: var(--gray);
    color: #555;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    padding: 12px 10px 50px;
    cursor: pointer;
    text-align: center;
    border-right: 1px solid #fff;
    border-top: 3px solid transparent;
    transition: all .2s;
    user-select: none;
  }

  .auto-btn:hover, .auto-btn.active {
    background: #333;
    color: #bbb;
    border-top-color: var(--red);
  }

  .counter-box {
    background: #050505;
    border: 2px solid #050505;
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 15px;
    gap: 10px;
  }

  .counter-item {
    color: #848484;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    text-align: center;
  }

  .counter-item .num {
    color: #fff;
    font-size: 28px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    display: block;
    margin-top: 4px;
  }

  .main-area {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 0;
    background: #333;
    min-height: 400px;
  }

  .big-car-area {
    background: #333;
    position: relative;
    overflow: hidden;
  }

  .car-svg-wrap {
    display: none;
    width: 100%;
  }

  .car-svg-wrap.active {
    display: block;
  }

  .car-svg-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .top-view-area {
    background: #1a1a1a;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .top-view-area svg {
    width: 220px;
    height: auto;
    max-height: 420px;
  }

  /* Quick select */
  .quick-select {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    background: #d7d8d9;
    margin-top: 0;
  }

  .qs-label {
    background: #d7d8d9;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: #333;
    padding: 12px 15px;
    border-bottom: 3px solid var(--red);
    white-space: nowrap;
  }

  .qs-btns {
    display: flex;
    flex-wrap: wrap;
  }

  .qs-btn {
    background: #d7d8d9;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: #333;
    padding: 12px 15px;
    border-right: 1px solid #fff;
    border-bottom: 3px solid var(--red);
    cursor: pointer;
    transition: background .15s;
  }

  .qs-btn:hover { background: #c2c3c5; }

  /* Parts tables */
  .tables-section {
    margin-top: 20px;
  }

  .part-table {
    display: none;
    margin-bottom: 10px;
    box-shadow: 0 0 9px #ccc;
    background: #fff;
  }

  .part-table.visible { display: block; }

  .pt-inner {
    display: flex;
    flex-wrap: wrap;
  }

  .pt-trash {
    width: 80px;
    min-width: 80px;
    border: 1px solid var(--border);
    padding: 10px;
    text-align: center;
    cursor: pointer;
  }

  .pt-trash .col-label {
    font-size: 11px;
    color: #888;
    border-bottom: 1px solid var(--border);
    padding: 5px 0;
    margin: -10px -10px 10px;
  }

  .pt-trash svg { fill: #ccc; transition: fill .2s; }
  .pt-trash:hover svg { fill: var(--red); }

  .pt-name {
    width: 150px;
    min-width: 150px;
    border: 1px solid var(--border);
    padding: 10px;
    text-align: center;
  }

  .pt-name .col-label {
    font-size: 11px;
    color: #888;
    border-bottom: 1px solid var(--border);
    padding: 5px 0;
    margin: -10px -10px 10px;
  }

  .pt-name .part-name-val {
    font-size: 16px;
    color: #4c4c4c;
    margin-top: 8px;
  }

  .pt-services {
    flex: 1;
  }

  .pt-services-inner {
    display: flex;
    flex-wrap: wrap;
  }

  .svc-col {
    flex: 1;
    min-width: 100px;
    border: 1px solid var(--border);
    padding: 10px;
    text-align: center;
  }

  .svc-col .col-label {
    font-size: 10px;
    color: #888;
    background: #f8f8f8;
    border-bottom: 1px solid var(--border);
    padding: 5px 0;
    margin: -10px -10px 10px;
    white-space: nowrap;
  }

  .svc-total-col {
    flex: 1;
    min-width: 100px;
    border: 1px solid var(--border);
    padding: 10px;
    text-align: center;
  }

  .svc-total-col .col-label {
    font-size: 11px;
    color: #888;
    border-bottom: 1px solid var(--border);
    padding: 5px 0;
    margin: -10px -10px 10px;
  }

  .svc-total-col .total-val {
    font-size: 18px;
    color: var(--red);
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    margin-top: 8px;
  }

  .check-row {
    display: none;
    margin-bottom: 6px;
  }

  .check-row.for-sedan { display: none; }
  .check-row.for-hatchback { display: none; }
  .check-row.for-crossover { display: none; }

  .check-row.show { display: block; }

  .check-row .price-label {
    font-size: 12px;
    color: #4c4c4c;
    margin-top: 4px;
  }

  /* Toggle switch */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: center;
    margin-top: 2px;
  }

  .toggle-cb {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }

  .toggle-label {
    position: relative;
    width: 44px;
    height: 22px;
    cursor: pointer;
    display: inline-block;
  }

  .toggle-label::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 44px; height: 22px;
    border-radius: 11px;
    background: #9a9a9a;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.2);
    transition: background .2s;
  }

  .toggle-label::after {
    content: '';
    position: absolute;
    top: -1px; left: -1px;
    width: 24px; height: 24px;
    border-radius: 12px;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    transition: left .2s;
  }

  .toggle-cb:checked + .toggle-label::before { background: var(--red); }
  .toggle-cb:checked + .toggle-label::after { left: 21px; }

  /* SVG detal styles */
  .detal {
    cursor: pointer;
    fill: #fff;
    fill-opacity: 0.5;
    stroke: #000;
    stroke-width: 0.5;
    transition: fill .15s, fill-opacity .15s;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  /* hover только на устройствах с мышью */
  @media (hover: hover) {
    .detal:hover {
      fill: #ff4444 !important;
      fill-opacity: 0.65 !important;
    }
  }

  .detal.on {
    fill: var(--red) !important;
    fill-opacity: 0.75 !important;
  }

  /* на тач-устройствах убираем залипший hover */
  @media (hover: none) {
    .detal:hover {
      fill: #fff !important;
      fill-opacity: 0.5 !important;
    }
    .detal.on:hover {
      fill: var(--red) !important;
      fill-opacity: 0.75 !important;
    }
  }

  /* more info bar */
  .more-info {
    padding: 15px 20px;
    color: #999;
    font-size: 13px;
    background: #111;
    font-family: 'Oswald', sans-serif;
    font-weight: 400;
    letter-spacing: 0.5px;
  }

  .more-info span {
    background: #2a2a2a;
    color: #ccc;
    padding: 5px 10px;
    text-transform: uppercase;
    font-weight: 500;
    font-size: 12px;
    margin: 0 4px;
  }

  .more-info .sum-val { color: var(--red); }

  @media (max-width: 900px) {
    .top-bar { grid-template-columns: 1fr 1fr; }
    .calc-title { grid-column: 1/-1; }
    .main-area { grid-template-columns: 1fr; }
    .top-view-area { display: none; }
    .pt-name { width: 120px; min-width: 120px; }
    .svc-col { min-width: 80px; }
  }

  @media (max-width: 600px) {
    .top-bar { grid-template-columns: 1fr; }
    .counter-box { grid-column: 1/-1; }
    .pt-trash { width: 60px; min-width: 60px; }
    .pt-name { width: 100px; min-width: 100px; font-size: 13px; }
  }
</style>
</head>

<div id="calculator">

    <div class="calc-title">Для расчёта нажмите на деталь автомобиля</div>

      <div class="qs-btn" data-group="lobby">Перед</div>
      <div class="qs-btn" data-group="rear">Зад</div>
      <div class="qs-btn" data-group="bumpers">Бамперы</div>
      <div class="qs-btn" data-group="all">Все</div>
    </div>
  </div>

  <div class="more-info">
    Тип кузова: <span id="mi-type">Sedan</span>
    выбрано элементов: <span id="mi-count">0</span>
    на общую сумму: <span id="mi-sum" class="sum-val">0 ₽</span>
  </div>

  <!-- TABLES SECTION -->
  <div class="tables-section" id="tables-section"></div>

</div>

<script>
// Part data
const PARTS = [
  { id:'pzk', name:'Правое заднее крыло',   groups:['right','rear','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:2000}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:2000}, crossover:{p:11000,r1:5000,r2:12000,z:3000,s:2000} } },
  { id:'pp',  name:'Правый порог',           groups:['right','all'],
    prices:{ sedan:{p:11500,r1:5000,r2:10000,z:2000,s:2000}, hatchback:{p:11500,r1:5000,r2:10000,z:2000,s:2000}, crossover:{p:11500,r1:5000,r2:10000,z:2000,s:2000} } },
  { id:'pzd', name:'Правая задняя дверь',   groups:['right','rear','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, crossover:{p:11000,r1:5000,r2:10000,z:3000,s:1500} } },
  { id:'ppd', name:'Правая передняя дверь', groups:['right','lobby','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, crossover:{p:11000,r1:5000,r2:10000,z:3000,s:1500} } },
  { id:'ppk', name:'Правое переднее крыло', groups:['right','lobby','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:2000}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:2000}, crossover:{p:11000,r1:5000,r2:10000,z:3000,s:2000} } },
  { id:'bag', name:'Багажник',              groups:['rear','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:0,s:2500}, hatchback:{p:11000,r1:5000,r2:10000,z:0,s:2500}, crossover:{p:11000,r1:5000,r2:10000,z:0,s:2500} } },
  { id:'kry', name:'Крыша',                groups:['lobby','all'],
    prices:{ sedan:{p:20000,r1:10000,r2:15000,z:0,s:0}, hatchback:{p:20000,r1:10000,r2:15000,z:0,s:0}, crossover:{p:20000,r1:10000,r2:15000,z:0,s:0} } },
  { id:'kap', name:'Капот',                groups:['lobby','all'],
    prices:{ sedan:{p:18500,r1:5000,r2:12000,z:0,s:1000}, hatchback:{p:18500,r1:5000,r2:12000,z:0,s:1000}, crossover:{p:18500,r1:5000,r2:12000,z:0,s:1000} } },
  { id:'zb',  name:'Задний бампер',        groups:['rear','bumpers','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, crossover:{p:11000,r1:5000,r2:10000,z:3000,s:1500} } },
  { id:'pb',  name:'Передний бампер',      groups:['lobby','bumpers','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, crossover:{p:11000,r1:5000,r2:10000,z:3000,s:1500} } },
  { id:'lzk', name:'Левое заднее крыло',   groups:['left','rear','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:2000}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:2000}, crossover:{p:11000,r1:5000,r2:12000,z:3000,s:2000} } },
  { id:'lp',  name:'Левый порог',          groups:['left','all'],
    prices:{ sedan:{p:11500,r1:5000,r2:10000,z:0,s:2000}, hatchback:{p:11500,r1:5000,r2:10000,z:0,s:2000}, crossover:{p:11500,r1:5000,r2:10000,z:0,s:2000} } },
  { id:'lzd', name:'Левая задняя дверь',   groups:['left','rear','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, crossover:{p:11000,r1:5000,r2:10000,z:3000,s:1500} } },
  { id:'lpd', name:'Левая передняя дверь', groups:['left','lobby','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:1500}, crossover:{p:11000,r1:5000,r2:10000,z:3000,s:1500} } },
  { id:'lpk', name:'Левое переднее крыло', groups:['left','lobby','all'],
    prices:{ sedan:{p:11000,r1:5000,r2:10000,z:3000,s:2000}, hatchback:{p:11000,r1:5000,r2:10000,z:3000,s:2000}, crossover:{p:11000,r1:5000,r2:10000,z:3000,s:2000} } },
];

const SVC_KEYS = ['p','r1','r2','z','s'];
const SVC_LABELS = ['Покраска','Ремонт < 50%','Ремонт > 50%','Замена','Снятие / установка'];

let currentType = 'sedan';
let selected = new Set(); // part ids selected
let partSvcState = {}; // partId -> {svc: bool}
PARTS.forEach(p => { partSvcState[p.id] = {}; SVC_KEYS.forEach(k => partSvcState[p.id][k] = false); });

// Build tables
function buildTables() {
  const sec = document.getElementById('tables-section');
  sec.innerHTML = '';
  PARTS.forEach(part => {
    const div = document.createElement('div');
    div.className = 'part-table';
    div.id = 'table_' + part.id;
    div.innerHTML = buildTableHTML(part);
    sec.appendChild(div);
  });
  // Attach checkbox listeners
  PARTS.forEach(part => {
    SVC_KEYS.forEach(k => {
      const cb = document.getElementById('cb_' + part.id + '_' + k);
      if (cb) {
        cb.addEventListener('change', () => {
          partSvcState[part.id][k] = cb.checked;
          updatePartTotal(part.id);
          updateTotal();
        });
      }
    });
    // Trash
    const trash = document.getElementById('trash_' + part.id);
    if (trash) trash.addEventListener('click', () => deselectPart(part.id));
  });
}

function buildTableHTML(part) {
  const pr = part.prices[currentType];
  const svcCols = SVC_KEYS.map((k, i) => `
    <div class="svc-col">
      <div class="col-label">${SVC_LABELS[i]}</div>
      <div class="toggle-wrap">
        <input type="checkbox" class="toggle-cb" id="cb_${part.id}_${k}" ${partSvcState[part.id][k] ? 'checked' : ''}>
        <label class="toggle-label" for="cb_${part.id}_${k}"></label>
      </div>
      <div class="price-label">${pr[k] > 0 ? pr[k].toLocaleString('ru') + ' ₽' : '—'}</div>
    </div>
  `).join('');

  return `
    <div class="pt-inner">
      <div class="pt-trash" id="trash_${part.id}">
        <div class="col-label">-</div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"/>
          <path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
        </svg>
      </div>
      <div class="pt-name">
        <div class="col-label">элемент</div>
        <div class="part-name-val">${part.name}</div>
      </div>
      <div class="pt-services">
        <div class="pt-services-inner">
          ${svcCols}
          <div class="svc-total-col">
            <div class="col-label">сумма</div>
            <div class="total-val" id="total_${part.id}">0 ₽</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function rebuildTable(partId) {
  const part = PARTS.find(p => p.id === partId);
  const div = document.getElementById('table_' + partId);
  if (!div || !part) return;
  div.innerHTML = buildTableHTML(part);
  // Reattach listeners
  SVC_KEYS.forEach(k => {
    const cb = document.getElementById('cb_' + partId + '_' + k);
    if (cb) cb.addEventListener('change', () => {
      partSvcState[partId][k] = cb.checked;
      updatePartTotal(partId);
      updateTotal();
    });
  });
  const trash = document.getElementById('trash_' + partId);
  if (trash) trash.addEventListener('click', () => deselectPart(partId));
  updatePartTotal(partId);
}

function updatePartTotal(partId) {
  const part = PARTS.find(p => p.id === partId);
  const pr = part.prices[currentType];
  let sum = 0;
  SVC_KEYS.forEach(k => { if (partSvcState[partId][k]) sum += pr[k]; });
  const el = document.getElementById('total_' + partId);
  if (el) el.textContent = sum.toLocaleString('ru') + ' ₽';
}

function updateTotal() {
  let total = 0;
  selected.forEach(id => {
    const part = PARTS.find(p => p.id === id);
    const pr = part.prices[currentType];
    SVC_KEYS.forEach(k => { if (partSvcState[id][k]) total += pr[k]; });
  });
  document.getElementById('el-count').textContent = selected.size;
  const sumStr = total.toLocaleString('ru') + ' ₽';
  document.getElementById('el-sum').textContent = sumStr;
  document.getElementById('mi-count').textContent = selected.size;
  document.getElementById('mi-sum').textContent = sumStr;
  document.getElementById('mi-type').textContent = {sedan:'Sedan',hatchback:'Hatchback',crossover:'Crossover'}[currentType];
}

function selectPart(id) {
  if (selected.has(id)) {
    deselectPart(id);
    return;
  }
  selected.add(id);
  // highlight all SVG elements with this data-name
  document.querySelectorAll(`.detal[data-name="${id}"]`).forEach(el => el.classList.add('on'));
  // show table
  const t = document.getElementById('table_' + id);
  if (t) { t.classList.add('visible'); rebuildTable(id); }
  updateTotal();
}

function deselectPart(id) {
  selected.delete(id);
  document.querySelectorAll(`.detal[data-name="${id}"]`).forEach(el => el.classList.remove('on'));
  const t = document.getElementById('table_' + id);
  if (t) t.classList.remove('visible');
  // Reset checkboxes
  SVC_KEYS.forEach(k => { partSvcState[id][k] = false; });
  updateTotal();
}

// SVG click
document.addEventListener('click', e => {
  const detal = e.target.closest('.detal');
  if (!detal) return;
  const name = detal.dataset.name;
  if (!name) return;
  // Find canonical part id
  const part = PARTS.find(p => p.id === name);
  if (!part) return;
  selectPart(part.id);
});

// Type switcher
document.querySelectorAll('.auto-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.auto-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    document.querySelectorAll('.car-svg-wrap').forEach(w => w.classList.remove('active'));
    document.getElementById('type_' + currentType).classList.add('active');
    // Rebuild visible tables with new prices
    selected.forEach(id => rebuildTable(id));
    updateTotal();
  });
});

// Quick select
document.querySelectorAll('.qs-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    if (group === 'all') {
      // toggle: if all selected, deselect all; else select all
      const allIds = PARTS.map(p => p.id);
      const allSelected = allIds.every(id => selected.has(id));
      if (allSelected) {
        allIds.forEach(id => deselectPart(id));
      } else {
        allIds.forEach(id => { if (!selected.has(id)) selectPart(id); });
      }
    } else {
      const groupParts = PARTS.filter(p => p.groups.includes(group));
      const allSelected = groupParts.every(p => selected.has(p.id));
      if (allSelected) {
        groupParts.forEach(p => deselectPart(p.id));
      } else {
        groupParts.forEach(p => { if (!selected.has(p.id)) selectPart(p.id); });
      }
    }
  });
});

// Init
buildTables();
updateTotal();
</script>
</body>
</html>
