<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор кузовного ремонта</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%23111'/><text x='32' y='46' font-family='Arial Black,sans-serif' font-size='40' font-weight='900' fill='%23d20124' text-anchor='middle'>К</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Sans:wght@400;700&display=swap');

  :root {
    --red: #d20124;
    --dark: #111;
    --mid: #222;
    --gray: #c2c3c5;
    --lightgray: #f0f0f0;
    --text: #333;
    --border: #ddd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  svg, path { outline: none; }
  svg { touch-action: manipulation; }

  body {
    font-family: 'PT Sans', sans-serif;
    background: #1a1a1a;
    color: var(--text);
    min-height: 100vh;
  }

  #calculator {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  h1 {
    font-family: 'Oswald', sans-serif;
    color: #fff;
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding-bottom: 12px;
    border-bottom: 3px solid var(--red);
  }

  .top-bar {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    gap: 0;
    margin-bottom: 0;
    align-items: stretch;
  }

  .calc-title {
    background: var(--dark);
    color: var(--red);
    font-family: 'Oswald', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 20px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    border-left: 4px solid var(--red);
  }

  .type-selector {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border-top: 2px solid var(--gray);
  }

  .auto-btn {
    background: var(--gray);
    color: #555;
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    padding: 12px 10px 50px;
    cursor: pointer;
    text-align: center;
    border-right: 1px solid #fff;
    border-top: 3px solid transparent;
    transition: all .2s;
    user-select: none;
  }

  .auto-btn:hover, .auto-btn.active {
    background: #333;
    color: #bbb;
    border-top-color: var(--red);
  }

  .counter-box {
    background: #050505;
    border: 2px solid #050505;
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 15px;
    gap: 10px;
  }

  .counter-item {
    color: #848484;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    text-align: center;
  }

  .counter-item .num {
    color: #fff;
    font-size: 28px;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    display: block;
    margin-top: 4px;
  }

  .main-area {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 0;
    background: #333;
    min-height: 400px;
  }

  .big-car-area {
    background: #333;
    position: relative;
    overflow: hidden;
  }

  .car-svg-wrap { display: none; width: 100%; }
  .car-svg-wrap.active { display: block; }
  .car-svg-wrap svg { width: 100%; height: auto; display: block; }

  .top-view-area {
    background: #1a1a1a;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .top-view-area svg { width: 220px; height: auto; max-height: 420px; }

  .quick-select {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    background: #d7d8d9;
    margin-top: 0;
  }

  .qs-label {
    background: #d7d8d9;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: #333;
    padding: 12px 15px;
    border-bottom: 3px solid var(--red);
    white-space: nowrap;
  }

  .qs-btns { display: flex; flex-wrap: wrap; }

  .qs-btn {
    background: #d7d8d9;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: #333;
    padding: 12px 15px;
    border-right: 1px solid #fff;
    border-bottom: 3px solid var(--red);
    cursor: pointer;
    transition: background .15s;
  }
  .qs-btn:hover { background: #c2c3c5; }

  /* ADD CUSTOM PART BUTTON */
  .add-part-btn {
    background: var(--red);
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: #fff;
    padding: 12px 18px;
    border-bottom: 3px solid #8a0016;
    cursor: pointer;
    transition: background .15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .add-part-btn:hover { background: #a8001d; }
  .add-part-btn svg { fill: #fff; flex-shrink: 0; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #1e1e1e;
    border: 1px solid #333;
    border-top: 3px solid var(--red);
    padding: 24px 28px;
    width: 520px;
    max-width: 95vw;
    max-height: 85vh;
    overflow-y: auto;
    font-family: 'PT Sans', sans-serif;
  }

  .modal h2 {
    font-family: 'Oswald', sans-serif;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }

  /* Catalog list */
  .catalog-list { display: flex; flex-direction: column; gap: 4px; }

  .catalog-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #111;
    border: 1px solid #2a2a2a;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    gap: 12px;
  }
  .catalog-item:hover { background: #1a1a1a; border-color: var(--red); }
  .catalog-item.already-added { opacity: 0.4; pointer-events: none; }

  .catalog-item-name {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #ddd;
    flex: 1;
  }

  .catalog-item-prices {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .catalog-price-chip {
    font-size: 10px;
    color: #777;
    background: #222;
    padding: 2px 7px;
    border: 1px solid #333;
    white-space: nowrap;
  }
  .catalog-price-chip span { color: #aaa; font-weight: 700; }

  .catalog-item-add {
    background: var(--red);
    color: #fff;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 12px;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }
  .catalog-item:hover .catalog-item-add { background: #a8001d; }

  .modal-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 10px 22px;
    cursor: pointer;
    border: none;
    outline: none;
    transition: background .15s;
  }
  .modal-btn.cancel { background: #333; color: #999; }
  .modal-btn.cancel:hover { background: #444; color: #ccc; }
  .modal-btn.confirm { background: var(--red); color: #fff; }
  .modal-btn.confirm:hover { background: #a8001d; }

  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  /* Parts tables */
  .tables-section { margin-top: 20px; }

  .part-table {
    display: none;
    margin-bottom: 10px;
    box-shadow: 0 0 9px #ccc;
    background: #fff;
  }
  .part-table.visible { display: block; }

  .pt-inner { display: flex; flex-wrap: wrap; }

  .pt-trash {
    width: 80px; min-width: 80px;
    border: 1px solid var(--border);
    padding: 10px; text-align: center; cursor: pointer;
  }
  .pt-trash .col-label {
    font-size: 11px; color: #888;
    border-bottom: 1px solid var(--border);
    padding: 5px 0; margin: -10px -10px 10px;
  }
  .pt-trash svg { fill: #ccc; transition: fill .2s; }
  .pt-trash:hover svg { fill: var(--red); }
  .mobile-part-name { display: none; }

  .pt-name {
    width: 170px; min-width: 170px;
    border: 1px solid var(--border);
    padding: 10px; text-align: center;
  }
  .pt-name .col-label {
    font-size: 11px; color: #888;
    border-bottom: 1px solid var(--border);
    padding: 5px 0; margin: -10px -10px 10px;
  }
  .pt-name .part-name-val { font-size: 15px; color: #4c4c4c; margin-top: 8px; }

  .pt-services { flex: 1; }
  .pt-services-inner { display: flex; flex-wrap: wrap; }

  .svc-col {
    flex: 1; min-width: 95px;
    border: 1px solid var(--border);
    padding: 10px; text-align: center;
  }
  .svc-col .col-label {
    font-size: 11px; color: #888;
    background: #f8f8f8;
    border-bottom: 1px solid var(--border);
    padding: 6px 4px; margin: -10px -10px 10px;
    line-height: 1.35;
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .svc-total-col {
    flex: 1; min-width: 110px;
    border: 1px solid var(--border);
    padding: 10px; text-align: center;
  }
  .svc-total-col .col-label {
    font-size: 12px; color: #888;
    border-bottom: 1px solid var(--border);
    padding: 5px 0; margin: -10px -10px 10px;
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .svc-total-col .total-val {
    font-size: 20px; color: var(--red);
    font-family: 'Oswald', sans-serif;
    font-weight: 600; margin-top: 8px;
  }

  .toggle-wrap {
    display: flex; align-items: center;
    gap: 4px; justify-content: center; margin-top: 2px;
  }
  .toggle-cb { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle-label {
    position: relative; width: 44px; height: 22px;
    cursor: pointer; display: inline-block;
  }
  .toggle-label::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 44px; height: 22px; border-radius: 11px;
    background: #9a9a9a;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.2);
    transition: background .2s;
  }
  .toggle-label::after {
    content: ''; position: absolute; top: -1px; left: -1px;
    width: 24px; height: 24px; border-radius: 12px;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
    transition: left .2s;
  }
  .toggle-cb:checked + .toggle-label::before { background: var(--red); }
  .toggle-cb:checked + .toggle-label::after { left: 21px; }

  .price-label { font-size: 13px; color: #4c4c4c; margin-top: 5px; font-weight: 700; }

  /* SVG detal styles */
  .detal {
    cursor: pointer;
    fill: #fff; fill-opacity: 0.5;
    stroke: #000; stroke-width: 0.5;
    transition: fill .15s, fill-opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) and (pointer: fine) {
    .detal:hover { fill: #ff4444 !important; fill-opacity: 0.65 !important; }
  }
  .detal.on { fill: var(--red) !important; fill-opacity: 0.75 !important; }

  .more-info {
    padding: 12px 16px; color: #999; font-size: 13px;
    background: #111; font-family: 'Oswald', sans-serif;
    font-weight: 400; letter-spacing: 0.5px;
    display: flex; flex-wrap: wrap;
    align-items: center; gap: 6px 0; line-height: 1.6;
  }
  .more-info .mi-label { color: #666; margin-right: 4px; white-space: nowrap; }
  .more-info .mi-val {
    background: #2a2a2a; color: #ccc;
    padding: 4px 10px; text-transform: uppercase;
    font-weight: 500; font-size: 12px;
    margin-right: 12px; white-space: nowrap;
    border-left: 2px solid #444;
  }
  .more-info .mi-val.sum-val { color: var(--red); border-left-color: var(--red); }

  /* Custom part badge */
  .custom-badge {
    display: inline-block;
    background: #2a2a2a;
    color: #888;
    font-size: 10px;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.5px;
    padding: 1px 6px;
    vertical-align: middle;
    margin-left: 4px;
    border: 1px solid #444;
  }

  /* Quality selector */
  .quality-item { display: flex; align-items: center; gap: 6px; }
  .quality-btns { display: flex; gap: 3px; }
  .quality-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #2a2a2a;
    color: #666;
    border: 1px solid #3a3a3a;
    padding: 5px 10px 5px 10px;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    line-height: 1;
  }
  .quality-btn .q-hint { font-size: 9px; color: #555; font-weight: 400; letter-spacing: 0; }
  .quality-btn:hover { background: #333; color: #aaa; border-color: #555; }
  .quality-btn.active[data-q="lite"]     { background: #1a2a1a; color: #5c5; border-color: #3a5a3a; }
  .quality-btn.active[data-q="standard"] { background: #2a2010; color: #da7; border-color: #5a4020; }
  .quality-btn.active[data-q="premium"]  { background: #2a1a1a; color: #e55; border-color: #5a2a2a; }
  .quality-btn.active .q-hint { color: inherit; opacity: 0.7; }


    .top-bar { grid-template-columns: 1fr 1fr; }
    .calc-title { grid-column: 1/-1; }
    .main-area { grid-template-columns: 1fr; }
    .top-view-area { display: none; }
    .pt-name { width: 130px; min-width: 130px; }
    .svc-col { min-width: 80px; }
  }

  @media (max-width: 600px) {
    h1 { font-size: 20px; letter-spacing: 1px; margin-bottom: 10px; }
    #calculator { padding: 8px; }
    .top-bar { grid-template-columns: 1fr; }
    .calc-title { display: none; }
    .type-selector { grid-template-columns: 1fr 1fr 1fr; border-top: none; }
    .auto-btn { padding: 10px 4px 40px; font-size: 11px; }
    .counter-box { grid-template-columns: 1fr 1fr; padding: 10px; }
    .counter-item .num { font-size: 22px; }
    .main-area { grid-template-columns: 1fr; display: flex; flex-direction: column; }
    .big-car-area { min-height: unset; }
    .top-view-area {
      display: flex !important; justify-content: center;
      padding: 12px; background: #1a1a1a;
    }
    .top-view-area svg { width: 160px; height: auto; }
    .quick-select { grid-template-columns: 1fr; }
    .qs-label { padding: 8px 12px; font-size: 10px; border-bottom: none; }
    .qs-btns { display: grid; grid-template-columns: repeat(3, 1fr); }
    .qs-btn { padding: 10px 4px; font-size: 10px; text-align: center; }
    .more-info {
      font-size: 11px; padding: 10px 12px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; align-items: start;
    }
    .more-info .mi-item { display: flex; flex-direction: column; gap: 2px; }
    .more-info .mi-label { font-size: 10px; margin: 0; }
    .more-info .mi-val { font-size: 12px; margin: 0; padding: 4px 8px; }
    .pt-inner { flex-direction: column; }
    .pt-trash {
      width: 100%; min-width: unset;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      border-bottom: 2px solid var(--red);
      background: #f8f8f8;
    }
    .pt-trash .col-label { display: none; }
    .pt-trash svg { width: 22px; height: 22px; flex-shrink: 0; }
    .mobile-part-name {
      display: block; font-family: 'Oswald', sans-serif;
      font-size: 13px; font-weight: 600;
      color: #333; text-transform: uppercase; flex: 1;
    }
    .pt-name { display: none; }
    .pt-services { width: 100%; }
    .pt-services-inner { display: grid; grid-template-columns: 1fr 1fr; }
    .svc-col { min-width: unset; padding: 8px 6px; }
    .svc-col .col-label { font-size: 9px; white-space: normal; line-height: 1.2; min-height: unset; }
    .svc-total-col {
      grid-column: 1 / -1; min-width: unset;
      padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between;
      border-top: 2px solid var(--border);
      background: #f8f8f8;
    }
    .svc-total-col .col-label { margin: 0; border: none; padding: 0; font-size: 12px; min-height: unset; }
    .svc-total-col .total-val { margin: 0; font-size: 20px; }
    .toggle-label { width: 38px; height: 20px; }
    .toggle-label::before { width: 38px; height: 20px; border-radius: 10px; }
    .toggle-label::after { width: 20px; height: 20px; }
    .toggle-cb:checked + .toggle-label::after { left: 18px; }
    .price-label { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="calculator">
  <h1>Калькулятор кузовного ремонта</h1>

  <div class="top-bar">
    <div class="calc-title">Для расчёта нажмите на деталь автомобиля</div>
    <div class="type-selector">
      <div class="auto-btn active" data-type="sedan">Седан</div>
      <div class="auto-btn" data-type="hatchback">Хэтчбек</div>
      <div class="auto-btn" data-type="crossover">Кроссовер</div>
    </div>
    <div class="counter-box">
      <div class="counter-item">элементов<span class="num" id="el-count">0</span></div>
      <div class="counter-item">на сумму<span class="num sum-display" id="el-sum">0 ₽</span></div>
    </div>
  </div>

  <div class="main-area">
    <div class="big-car-area">

      <!-- SEDAN -->
      <div class="car-svg-wrap active" id="type_sedan">

function getAllParts() { return [...PARTS, ...customParts]; }

// Returns effective price for a key, applying quality bonus if applicable
function effectiveVal(baseVal, key) {
  if (baseVal === 0) return 0;
  if (QUALITY_KEYS.includes(key)) return baseVal + QUALITY_BONUS[currentQuality];
  return baseVal;
}

function buildTables() {
  const sec = document.getElementById('tables-section');
  sec.innerHTML = '';
  getAllParts().forEach(part => {
    const div = document.createElement('div');
    div.className = 'part-table';
    div.id = 'table_' + part.id;
    div.innerHTML = buildTableHTML(part);
    sec.appendChild(div);
  });
  attachEvents();
}

function attachEvents() {
  getAllParts().forEach(part => {
    SVC_KEYS.forEach(k => {
      const cb = document.getElementById('cb_' + part.id + '_' + k);
      if (cb) cb.addEventListener('change', () => {
        partSvcState[part.id][k] = cb.checked;
        updatePartTotal(part.id);
        updateTotal();
      });
    });
    const trash = document.getElementById('trash_' + part.id);
    if (trash) trash.addEventListener('click', () => deselectPart(part.id));
  });
}

function buildTableHTML(part) {
  const basePr = part.isCustom ? part.prices : part.prices[currentType];
  const isCustom = part.isCustom;

  const svcCols = SVC_KEYS.map((k, i) => {
    const baseVal = basePr[k];
    const val = effectiveVal(baseVal, k);
    const hasBonus = QUALITY_KEYS.includes(k) && baseVal > 0 && QUALITY_BONUS[currentQuality] > 0;
    let displayVal;
    if (baseVal === 0) {
      displayVal = '—';
    } else if (hasBonus) {
      displayVal = val.toLocaleString('ru') + ' ₽<small style="color:#888;font-size:10px;display:block;font-weight:400">+' + QUALITY_BONUS[currentQuality].toLocaleString('ru') + '</small>';
    } else {
      displayVal = val.toLocaleString('ru') + ' ₽';
    }
    const disabled = baseVal === 0 ? 'disabled' : '';
    const labelHtml = SVC_LABELS[i].replace('\n', '<br>');
    return `
      <div class="svc-col">
        <div class="col-label">${labelHtml}</div>
        <div class="toggle-wrap">
          <input type="checkbox" class="toggle-cb" id="cb_${part.id}_${k}"
            ${partSvcState[part.id][k] ? 'checked' : ''} ${disabled}>
          <label class="toggle-label" for="cb_${part.id}_${k}" style="${baseVal===0?'opacity:.35;pointer-events:none':''}"></label>
        </div>
        <div class="price-label">${displayVal}</div>
      </div>`;
  }).join('');

  const customBadge = isCustom ? '<span class="custom-badge">доп.</span>' : '';

  return `
    <div class="pt-inner">
      <div class="pt-trash" id="trash_${part.id}">
        <div class="col-label">-</div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12z"/>
          <path d="M19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
        </svg>

      </div>
      <div class="pt-name">
        <div class="col-label">элемент</div>
        <div class="part-name-val">${part.name}${customBadge}</div>
      </div>
      <div class="pt-services">
        <div class="pt-services-inner">
          ${svcCols}
          <div class="svc-total-col">
            <div class="col-label">сумма</div>
            <div class="total-val" id="total_${part.id}">0 ₽</div>
          </div>
        </div>
      </div>
    </div>`;
}

function rebuildTable(partId) {
  const part = getAllParts().find(p => p.id === partId);
  const div = document.getElementById('table_' + partId);
  if (!div || !part) return;
  div.innerHTML = buildTableHTML(part);
  SVC_KEYS.forEach(k => {
    const cb = document.getElementById('cb_' + partId + '_' + k);
    if (cb) cb.addEventListener('change', () => {
      partSvcState[partId][k] = cb.checked;
      updatePartTotal(partId);
      updateTotal();
    });
  });
  const trash = document.getElementById('trash_' + partId);
  if (trash) trash.addEventListener('click', () => deselectPart(partId));
  updatePartTotal(partId);
}

function updatePartTotal(partId) {
  const part = getAllParts().find(p => p.id === partId);
  const basePr = part.isCustom ? part.prices : part.prices[currentType];
  let sum = 0;
  SVC_KEYS.forEach(k => { if (partSvcState[partId][k]) sum += effectiveVal(basePr[k], k); });
  const el = document.getElementById('total_' + partId);
  if (el) el.textContent = sum.toLocaleString('ru') + ' ₽';
}

function updateTotal() {
  let total = 0;
  selected.forEach(id => {
    const part = getAllParts().find(p => p.id === id);
    if (!part) return;
    const basePr = part.isCustom ? part.prices : part.prices[currentType];
    SVC_KEYS.forEach(k => { if (partSvcState[id][k]) total += effectiveVal(basePr[k], k); });
  });
  document.getElementById('el-count').textContent = selected.size;
  const sumStr = total.toLocaleString('ru') + ' ₽';
  document.getElementById('el-sum').textContent = sumStr;
  document.getElementById('mi-count').textContent = selected.size;
  document.getElementById('mi-sum').textContent = sumStr;
  document.getElementById('mi-type').textContent = TYPE_LABELS[currentType];
}

function selectPart(id) {
  if (selected.has(id)) { deselectPart(id); return; }
  selected.add(id);
  document.querySelectorAll(`.detal[data-name="${id}"]`).forEach(el => el.classList.add('on'));
  const t = document.getElementById('table_' + id);
  if (t) { t.classList.add('visible'); rebuildTable(id); }
  updateTotal();
}

function deselectPart(id) {
  selected.delete(id);
  document.querySelectorAll(`.detal[data-name="${id}"]`).forEach(el => {
    el.classList.remove('on');
    el.style.setProperty('fill', '#fff', 'important');
    el.style.setProperty('fill-opacity', '0.5', 'important');
    setTimeout(() => {
      el.style.removeProperty('fill');
      el.style.removeProperty('fill-opacity');
    }, 50);
  });
  const t = document.getElementById('table_' + id);
  if (t) t.classList.remove('visible');
  const idx = customParts.findIndex(p => p.id === id);
  if (idx !== -1) {
    customParts.splice(idx, 1);
    delete partSvcState[id];
    const tableDiv = document.getElementById('table_' + id);
    if (tableDiv) tableDiv.remove();
  } else {
    SVC_KEYS.forEach(k => { partSvcState[id][k] = false; });
  }
  updateTotal();
}

document.addEventListener('click', e => {
  const detal = e.target.closest('.detal');
  if (!detal) return;
  const name = detal.dataset.name;
  if (!name) return;
  const part = getAllParts().find(p => p.id === name);
  if (!part) return;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  selectPart(part.id);
});

document.querySelectorAll('.auto-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.auto-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    document.querySelectorAll('.car-svg-wrap').forEach(w => w.classList.remove('active'));
    document.getElementById('type_' + currentType).classList.add('active');
    selected.forEach(id => rebuildTable(id));
    updateTotal();
  });
});

document.querySelectorAll('.qs-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    if (group === 'all') {
      const allIds = PARTS.map(p => p.id);
      const allSelected = allIds.every(id => selected.has(id));
      if (allSelected) { allIds.forEach(id => deselectPart(id)); }
      else { allIds.forEach(id => { if (!selected.has(id)) selectPart(id); }); }
    } else {
      const groupParts = PARTS.filter(p => p.groups.includes(group));
      const allSelected = groupParts.every(p => selected.has(p.id));
      if (allSelected) { groupParts.forEach(p => deselectPart(p.id)); }
      else { groupParts.forEach(p => { if (!selected.has(p.id)) selectPart(p.id); }); }
    }
  });
});

// ---- QUALITY SELECTOR ----
document.querySelectorAll('.quality-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentQuality = btn.dataset.q;
    selected.forEach(id => rebuildTable(id));
    updateTotal();
  });
});

// ---- CATALOG MODAL ----
const modalOverlay = document.getElementById('modal-overlay');
const modalCancel  = document.getElementById('modal-cancel');
const openModalBtn = document.getElementById('open-modal-btn');

function buildCatalogList() {
  const list = document.getElementById('catalog-list');
  list.innerHTML = '';
  CATALOG.forEach((item, idx) => {
    const alreadyAdded = customParts.some(cp => cp.name === item.name);
    const div = document.createElement('div');
    div.className = 'catalog-item' + (alreadyAdded ? ' already-added' : '');

    // Price chips: show non-zero values
    const chips = SVC_KEYS.map((k, i) => {
      const v = item.prices[k];
      if (!v) return '';
      const short = ['С/У','Р/С','Зам','Окр1','Окр2','Р>50','Р<50'][i];
      return `<span class="catalog-price-chip">${short}: <span>${v.toLocaleString('ru')} ₽</span></span>`;
    }).join('');

    div.innerHTML = `
      <div class="catalog-item-name">${item.name}</div>
      <div class="catalog-item-prices">${chips}</div>
      <div class="catalog-item-add">+ Добавить</div>`;

    div.addEventListener('click', () => {
      if (div.classList.contains('already-added')) return;
      addCustomPart(item.name, { ...item.prices });
      div.classList.add('already-added');
    });

    list.appendChild(div);
  });
}

function openModal() {
  buildCatalogList();
  modalOverlay.classList.add('open');
}
function closeModal() { modalOverlay.classList.remove('open'); }

openModalBtn.addEventListener('click', openModal);
modalCancel.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

function addCustomPart(name, prices) {
  customCounter++;
  const id = 'custom_' + customCounter;
  const part = { id, name, isCustom: true, groups: [], prices };
  customParts.push(part);
  partSvcState[id] = {};
  SVC_KEYS.forEach(k => partSvcState[id][k] = false);

  const sec = document.getElementById('tables-section');
  const div = document.createElement('div');
  div.className = 'part-table';
  div.id = 'table_' + id;
  div.innerHTML = buildTableHTML(part);
  sec.appendChild(div);

  SVC_KEYS.forEach(k => {
    const cb = document.getElementById('cb_' + id + '_' + k);
    if (cb) cb.addEventListener('change', () => {
      partSvcState[id][k] = cb.checked;
      updatePartTotal(id);
      updateTotal();
    });
  });
  const trash = document.getElementById('trash_' + id);
  if (trash) trash.addEventListener('click', () => deselectPart(id));

  selectPart(id);
  // scroll to new table
  const tableEl = document.getElementById('table_' + id);
  if (tableEl) setTimeout(() => tableEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

buildTables();
updateTotal();
</script>
